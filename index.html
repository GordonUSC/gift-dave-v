<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- STYLE: Block party pop (lemon yellow, hot pink, brownie brown, Bungee display with Outfit) | WHY: Gordon and David have gone to Brownies and Lemonade drum and bass together since the crew's second show five years ago, so the gift is a glass David fills, each pour opening up the track until the drop | ALT: A ride or die card, rejected because David already got one in September and wanted a new mechanic -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour the Drop</title>
<meta name="description" content="A drum and bass lemonade for David.">
<meta property="og:title" content="Pour the Drop, for David">
<meta property="og:image" content="https://gordonusc.github.io/gift-dave-v/img/hero.jpg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@500;800&display=swap">
<style>
:root{--lemon:#ffe14d;--pink:#ff4f9a;--brown:#5a3420;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b0f0a;color:#fff;font:16px/1.4 Outfit,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.stage{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,calc(100svh*9/16));overflow:hidden}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.55) saturate(.8);transition:filter .6s}
.drop .bg{filter:brightness(1) saturate(1.25)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 18px);text-align:center;padding:0 16px;text-shadow:0 3px 0 var(--brown),0 4px 18px #000a}
.top small{font-weight:800;font-size:11px;letter-spacing:.3em;color:var(--lemon)}
.top h1{font:400 clamp(34px,11vw,52px)/1 Bungee,sans-serif;margin:6px 0;color:var(--lemon)}
.top p{margin:0 auto;max-width:28ch;font-size:15px}
.glass{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);width:120px;height:170px;transform:translateX(-50%);border:5px solid #fffd;border-top:0;border-radius:0 0 26px 26px;overflow:hidden;background:#ffffff1f;box-shadow:0 10px 40px #0008}
.glass i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#ff8fc0,#ff4f9a);transition:height .45s cubic-bezier(.3,1.4,.5,1)}
.lemons{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);display:flex;justify-content:center;gap:14px}
.lemon{width:58px;height:58px;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffe14d 45%,#e6b800);box-shadow:0 0 0 4px #fff6 inset,0 6px 16px #0007;font:400 12px Bungee,sans-serif;color:var(--brown);transition:transform .15s,opacity .3s}
.lemon:active{transform:scale(.9)}
.lemon.used{opacity:.25;pointer-events:none}
.end{position:absolute;left:16px;right:16px;top:42%;text-align:center;opacity:0;transform:scale(.8);transition:all .5s;pointer-events:none;text-shadow:0 3px 0 var(--brown),0 4px 20px #000}
.end.on{opacity:1;transform:none}
.end h2{font:400 clamp(30px,10vw,46px)/1.05 Bungee,sans-serif;margin:0 0 8px;color:var(--lemon)}
.end p{margin:0 auto;max-width:28ch;font-size:16px;font-weight:800}
.foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);text-align:center;font-size:11px;opacity:.75;pointer-events:none}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg" src="img/hero.jpg" alt="A drum and bass block party at dusk with a giant inflatable lemon, brownie stage props and a glass of pink lemonade">
  <canvas id="c"></canvas>
  <div class="top"><small>FOR DAVID</small><h1>Pour the Drop</h1><p>Brownies, lemonade, drum and bass. Squeeze all four lemons. Sound on, loud.</p></div>
  <div class="glass"><i id="fill"></i></div>
  <div class="lemons"><button class="lemon" type="button">1</button><button class="lemon" type="button">2</button><button class="lemon" type="button">3</button><button class="lemon" type="button">4</button></div>
  <div class="end" id="end"><h2>Since the second show</h2><p>Five years of drops together. Here's to many more, ride or die.</p></div>
  <div class="foot">made by Darby, Gordon's AI assistant, with love from Gordon</div>
</div>
<script>
// ElevenLabs sound design: liquid drum and bass bed, lemonade pour, crowd and air horn drop. Code only mixes (a lowpass that opens with each pour, levels).
const SND=['dnb','pour','drop'];
let ac=null, master=null, bufs={}, lp=null, bed=null;
function audio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=.9; master.connect(ac.destination); lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; lp.connect(master); SND.forEach(load);}catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
async function load(n){ if(bufs[n]) return bufs[n]; try{ const r=await fetch('snd/'+n+'.mp3'); const a=await r.arrayBuffer(); bufs[n]=await new Promise((ok,no)=>ac.decodeAudioData(a,ok,no)); }catch(e){} return bufs[n]; }
async function play(n,vol=1,loop=false,dest=null){ if(!audio()) return null; const b=await load(n); if(!b) return null; const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; s.loop=loop; g.gain.value=vol; s.connect(g).connect(dest||master); s.start(); return {s,g}; }
const c=document.getElementById('c'), x=c.getContext('2d'), D=Math.min(devicePixelRatio||1,2);
function size(){ c.width=c.clientWidth*D; c.height=c.clientHeight*D; } size(); addEventListener('resize',size);
let n=0, parts=[], pulse=0;
const FREQ=[380,900,2200,6000,20000];
document.querySelectorAll('.lemon').forEach(b=>b.addEventListener('click',async()=>{ audio(); if(b.classList.contains('used')) return; b.classList.add('used'); n++;
  if(!bed) bed=await play('dnb',.55,true,lp);
  play('pour',.8); document.getElementById('fill').style.height=(n*25)+'%';
  if(lp) lp.frequency.setTargetAtTime(FREQ[n],ac.currentTime,.25);
  if(bed) bed.g.gain.setTargetAtTime(.55+n*.08,ac.currentTime,.3);
  const r=b.getBoundingClientRect(), s=c.getBoundingClientRect(); burst((r.left+r.width/2-s.left)*D,(r.top-s.top)*D,14);
  if(n===4) setTimeout(()=>{ play('drop',.9); pulse=1; document.getElementById('stage').classList.add('drop'); document.getElementById('end').classList.add('on'); for(let k=0;k<6;k++) setTimeout(()=>burst(c.width*(.15+k*.14),c.height*.35,30),k*120); },450); }));
function burst(px,py,k){ const col=['#ffe14d','#ff4f9a','#ffffff','#8a5a3b']; for(let i=0;i<k;i++){ const a=i/k*Math.PI*2; parts.push({x:px,y:py,vx:Math.cos(a)*(2+i%4)*D,vy:Math.sin(a)*(2+i%3)*D-3*D,a:1,c:col[i%4],w:(4+i%4)*D,r:i}); } }
(function loop(){ x.clearRect(0,0,c.width,c.height);
  if(pulse>0){ pulse=Math.max(0,pulse-.004); const k=(Math.sin(performance.now()/86)+1)/2; x.fillStyle=`rgba(255,79,154,${.12*k*pulse+.02})`; x.fillRect(0,0,c.width,c.height); }
  parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.14*D; p.r+=.15; p.a-=.012; x.save(); x.globalAlpha=Math.max(p.a,0); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6); x.restore(); });
  parts=parts.filter(p=>p.a>0); requestAnimationFrame(loop); })();
</script>
</body>
</html>
